<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iREX Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#0b0e14] text-slate-200 min-h-screen p-4 flex flex-col items-center">
    <div class="w-full max-w-md space-y-4 pb-8">
        <div class="flex justify-between items-center bg-[#131822] p-4 rounded-2xl border border-slate-800">
            <div class="flex items-center space-x-2">
                <span class="text-emerald-400 font-bold text-lg">📈</span>
                <h1 class="font-bold text-lg tracking-wide text-white">iREX <span class="text-xs font-normal text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full">Dashboard</span></h1>
            </div>
            <div id="bot-status-container" class="flex items-center space-x-2 bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-800">
                <span id="bot-dot" class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span>
                <span id="bot-status-text" class="text-xs font-medium text-red-400">Sin conexión</span>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
            <div class="bg-[#131822] p-3 rounded-2xl border border-slate-800 text-center">
                <p class="text-[11px] text-slate-400 uppercase tracking-wider">Balance</p>
                <p id="balance" class="text-base font-bold text-white mt-1">$0</p>
            </div>
            <div class="bg-[#131822] p-3 rounded-2xl border border-slate-800 text-center">
                <p class="text-[11px] text-slate-400 uppercase tracking-wider">PnL Diario</p>
                <p id="pnl-diario" class="text-base font-bold text-emerald-400 mt-1">0%</p>
            </div>
            <div class="bg-[#131822] p-3 rounded-2xl border border-slate-800 text-center">
                <p class="text-[11px] text-slate-400 uppercase tracking-wider">Drawdown</p>
                <p id="drawdown" class="text-base font-bold text-rose-400 mt-1">0%</p>
            </div>
        </div>

        <div class="bg-[#131822] p-4 rounded-2xl border border-slate-800 space-y-3">
            <div class="flex justify-between items-center text-xs text-slate-400">
                <span class="font-semibold text-slate-300 flex items-center gap-1">📊 Curva de Capital</span>
                <span>Ratio 1:3 | Riesgo 1%</span>
            </div>
            <div class="h-48 w-full">
                <canvas id="capitalChart"></canvas>
            </div>
        </div>

        <div class="bg-[#131822] p-4 rounded-2xl border border-slate-800 space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-semibold text-slate-300 uppercase tracking-wider">🕒 Operaciones del Día</h2>
                <span id="trades-count" class="text-xs text-slate-400">0 trades</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="text-slate-500 border-b border-slate-800">
                            <th class="pb-2 font-medium">Activo</th>
                            <th class="pb-2 font-medium">Tipo</th>
                            <th class="pb-2 font-medium">Resultado</th>
                            <th class="pb-2 font-medium text-right">Hora</th>
                        </tr>
                    </thead>
                    <tbody id="trades-table-body" class="divide-y divide-slate-800/50">
                        <tr>
                            <td colspan="4" class="py-4 text-center text-slate-500">Esperando datos del bot...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let capitalChart = null;
        // URL del túnel activa actualmente configurada de forma directa para evitar cachés locales obsoletas
        const API_BASE_URL = 'https://represented-jury-appointment-gathering.trycloudflare.com';

        function initChart() {
            const ctx = document.getElementById('capitalChart').getContext('2d');
            capitalChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [], 
                    datasets: [{
                        data: [], 
                        borderColor: '#34d399',
                        borderWidth: 2,
                        tension: 0.3,
                        pointBackgroundColor: '#34d399',
                        fill: true,
                        backgroundColor: function(context) {
                            const chart = context.chart;
                            const {ctx, chartArea} = chart;
                            if (!chartArea) return null;
                            const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                            gradient.addColorStop(0, 'rgba(52, 211, 153, 0)');
                            gradient.addColorStop(1, 'rgba(52, 211, 153, 0.2)');
                            return gradient;
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { 
                            grid: { display: false }, 
                            ticks: { color: '#64748b', font: { size: 10 } } 
                        },
                        y: { 
                            grid: { color: '#1e293b' }, 
                            ticks: { color: '#64748b', font: { size: 10 } } 
                        }
                    }
                }
            });
        }

        function marcarDesconectadoRealidad() {
            document.getElementById('bot-dot').className = "w-2.5 h-2.5 rounded-full bg-red-500";
            const statusText = document.getElementById('bot-status-text');
            statusText.textContent = "Sin conexión";
            statusText.className = "text-xs font-medium text-red-400";
            document.getElementById('balance').textContent = "$0";
            document.getElementById('pnl-diario').textContent = "0%";
            document.getElementById('drawdown').textContent = "0%";
            document.getElementById('trades-count').textContent = "0 trades";
            document.getElementById('trades-table-body').innerHTML = `
                <tr>
                    <td colspan="4" class="py-4 text-center text-slate-500">Sin conexión con el bot...</td>
                </tr>
            `;
            if (capitalChart) {
                capitalChart.data.labels = [];
                capitalChart.data.datasets[0].data = [];
                capitalChart.update();
            }
        }

        async function sincronizarDatos() {
            try {
                const response = await fetch(API_BASE_URL, { cache: 'no-store' });
                if (!response.ok) throw new Error('Fallo de red');
                const data = await response.json();

                if (data.bot_status === "online") {
                    document.getElementById('bot-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse";
                    const statusText = document.getElementById('bot-status-text');
                    statusText.textContent = "Conectado";
                    statusText.className = "text-xs font-medium text-emerald-400";

                    const balanceVal = (data.account && data.account.balance !== undefined) ? data.account.balance : 0;
                    const pnlVal = (data.account && data.account.daily_pnl_percent !== undefined) ? data.account.daily_pnl_percent : 0;
                    const ddVal = (data.account && data.account.drawdown_percent !== undefined) ? data.account.drawdown_percent : 0;

                    document.getElementById('balance').textContent = `$${balanceVal.toLocaleString()}`;
                    document.getElementById('pnl-diario').textContent = `${pnlVal >= 0 ? '+' : ''}${pnlVal}%`;
                    document.getElementById('drawdown').textContent = `${ddVal}%`;

                    if (capitalChart && data.equity_curve && Array.isArray(data.equity_curve)) {
                        capitalChart.data.labels = data.equity_curve.map(pt => pt.time);
                        capitalChart.data.datasets[0].data = data.equity_curve.map(pt => pt.value);
                        capitalChart.update();
                    }

                    const tbody = document.getElementById('trades-table-body');
                    const trades = data.today_trades || [];
                    document.getElementById('trades-count').textContent = `${trades.length} trades`;

                    if (trades.length > 0) {
                        tbody.innerHTML = trades.map(t => `
                            <tr class="text-slate-300">
                                <td class="py-2.5 font-medium">${t.symbol}</td>
                                <td class="py-2.5"><span class="px-2 py-0.5 rounded text-[10px] font-bold ${t.type === 'BUY' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${t.type}</span></td>
                                <td class="py-2.5 font-semibold ${String(t.result).startsWith('+') ? 'text-emerald-400' : 'text-rose-400'}">${t.result}</td>
                                <td class="py-2.5 text-right text-slate-400">${t.time}</td>
                            </tr>
                        `).join('');
                    } else {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="4" class="py-4 text-center text-slate-500">No hay operaciones registradas hoy</td>
                            </tr>
                        `;
                    }
                } else {
                    marcarDesconectadoRealidad();
                }
            } catch (error) {
                console.error("Error sincronizando:", error);
                marcarDesconectadoRealidad();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            sincronizarDatos();
            setInterval(sincronizarDatos, 5000);
        });
    </script>
</body>
</html>
