<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Trading Bot</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-bold">iREX Trading Bot</h1>
            <span id="bot-status-indicator" class="px-3 py-1 rounded-full text-xs font-semibold bg-red-500/20 text-red-400">Sin conexión</span>
        </div>

        <div class="bg-slate-700/50 p-4 rounded-xl">
            <p class="text-sm text-slate-400">Balance de la cuenta</p>
            <p id="balance" class="text-3xl font-extrabold text-white mt-1">$0.00</p>
        </div>
    </div>

    <script>
        async function cargarDatosTrading() {
            try {
                const response = await fetch('https://corsproxy.io/?' + encodeURIComponent('http://193.122.243.181:8080/'));
                if (!response.ok) throw new Error('Error en el servidor');

                const data = await response.json();

                if (data.bot_status === "online") {
                    const elemBalance = document.getElementById('balance');
                    if (elemBalance) {
                        elemBalance.textContent = `$${data.account.balance.toLocaleString()}`;
                    }

                    const indicador = document.getElementById('bot-status-indicator');
                    if (indicador) {
                        indicador.className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400";
                        indicador.textContent = "Online";
                    }
                }
            } catch (error) {
                console.error("Sin conexión:", error);
                const indicador = document.getElementById('bot-status-indicator');
                if (indicador) {
                    indicador.className = "px-3 py-1 rounded-full text-xs font-semibold bg-red-500/20 text-red-400";
                    indicador.textContent = "Sin conexión";
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarDatosTrading();
            setInterval(cargarDatosTrading, 5000);
        });
    </script>
</body>
</html>
