<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Cuantitativo Pro - Trading</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background-color: #0b0f19; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
    input[type=range] { accent-color: #38bdf8; }
  </style>
</head>
<body class="p-3 max-w-xl mx-auto">
  <header class="text-center my-3">
    <h1 class="text-lg font-bold text-sky-400">Simulador de Capital & Gestión de Riesgo</h1>
    <p class="text-xs text-slate-400">Modelo Cuantitativo (EMA 200 / POC / Ratio 1:3)</p>
  </header>

  <!-- Panel de Control / Parámetros -->
  <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl mb-3 space-y-3 shadow-xl">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-medium text-slate-300">Capital Inicial ($): <span id="capVal" class="font-bold text-sky-400">200</span></label>
        <input type="range" id="capital" min="100" max="5000" step="50" value="200" class="w-full mt-1">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-300">Win Rate (%): <span id="winVal" class="font-bold text-sky-400">55</span>%</label>
        <input type="range" id="winRate" min="30" max="80" step="1" value="55" class="w-full mt-1">
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-medium text-slate-300">Ratio R:B (1:X): <span id="rrVal" class="font-bold text-sky-400">3.0</span></label>
        <input type="range" id="rrRatio" min="1" max="5" step="0.5" value="3.0" class="w-full mt-1">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-300">Días Operativos: <span id="daysVal" class="font-bold text-sky-400">200</span></label>
        <input type="range" id="days" min="30" max="365" step="5" value="200" class="w-full mt-1">
      </div>
    </div>
  </div>

  <!-- Métricas Clave de Resultados -->
  <div class="grid grid-cols-3 gap-2 mb-3">
    <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-center">
      <span class="text-[10px] text-slate-400 block">Balance Final</span>
      <span id="finalCap" class="text-sm font-bold text-emerald-400">$0</span>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-center">
      <span class="text-[10px] text-slate-400 block">Crecimiento</span>
      <span id="growthPct" class="text-sm font-bold text-sky-400">0%</span>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-center">
      <span class="text-[10px] text-slate-400 block">Max Drawdown</span>
      <span id="maxDD" class="text-sm font-bold text-rose-400">0%</span>
    </div>
  </div>

  <!-- Gráfico de Curva de Capital -->
  <div class="bg-slate-900 border border-slate-800 p-2 rounded-xl shadow-xl">
    <div class="h-64">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <script>
    const capitalInput = document.getElementById('capital');
    const winRateInput = document.getElementById('winRate');
    const rrRatioInput = document.getElementById('rrRatio');
    const daysInput = document.getElementById('days');

    const ctx = document.getElementById('chart').getContext('2d');
    let chart;

    function runSim() {
      const cap = parseFloat(capitalInput.value);
      const wr = parseFloat(winRateInput.value) / 100;
      const rr = parseFloat(rrRatioInput.value);
      const d = parseInt(daysInput.value);

      document.getElementById('capVal').innerText = cap.toLocaleString();
      document.getElementById('winVal').innerText = winRateInput.value;
      document.getElementById('rrVal').innerText = parseFloat(rrRatioInput.value).toFixed(1);
      document.getElementById('daysVal').innerText = d;

      let realBalance = cap;
      let expBalance = cap;
      let peak = cap;
      let maxDD = 0;

      const realData = [cap];
      const expData = [cap];
      const labels = ['Día 0'];

      // Expectativa matemática diaria basada en riesgo del 1% por trade
      const dailyExpectedReturn = (wr * rr - (1 - wr)) * 0.01;

      for (let i = 1; i <= d; i++) {
        const isWin = Math.random() < wr;
        // RIESGO FIJO: Arriesga 1% del capital actual por operación
        const tradeReturn = isWin ? (0.01 * rr) : -0.01;
        realBalance *= (1 + tradeReturn);
        
        if (realBalance > peak) peak = realBalance;
        const dd = (peak - realBalance) / peak;
        if (dd > maxDD) maxDD = dd;

        expBalance *= (1 + dailyExpectedReturn);

        if (i % Math.ceil(d / 20) === 0 || i === d) {
          realData.push(Math.round(realBalance * 100) / 100);
          expData.push(Math.round(expBalance * 100) / 100);
          labels.push('Día ' + i);
        }
      }

      const totalGrowth = ((realBalance - cap) / cap) * 100;

      document.getElementById('finalCap').innerText = '$' + Math.round(realBalance).toLocaleString();
      document.getElementById('growthPct').innerText = (totalGrowth > 0 ? '+' : '') + totalGrowth.toFixed(0) + '%';
      document.getElementById('maxDD').innerText = '-' + (maxDD * 100).toFixed(1) + '%';

      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            { 
              label: 'Simulación Real (Riesgo 1%)', 
              data: realData, 
              borderColor: '#38bdf8', 
              backgroundColor: 'rgba(56,189,248,0.08)', 
              fill: true, 
              tension: 0.2,
              borderWidth: 2,
              pointRadius: 0
            },
            { 
              label: 'Expectativa Teórica', 
              data: expData, 
              borderColor: '#64748b', 
              borderDash: [4, 4], 
              fill: false,
              borderWidth: 1.5,
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { 
            legend: { 
              labels: { color: '#94a3b8', boxWidth: 12, font: { size: 10 } } 
            } 
          },
          scales: {
            x: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 9 } } },
            y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 9 } } }
          }
        }
      });
    }

    [capitalInput, winRateInput, rrRatioInput, daysInput].forEach(el => el.addEventListener('input', runSim));
    runSim();
  </script>
</body>
</html>
