<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iREX - Dashboard Operativo cTrader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans antialiased pb-12">
    <!-- Header con Heartbeat en tiempo real -->
    <header class="bg-cardbg border-b border-slate-800 sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-2">
            <i class="fa-solid fa-chart-line text-emerald-400 text-xl"></i>
            <h1 class="font-bold text-lg tracking-wide">iREX <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">Dashboard</span></h1>
        </div>
        <div id="heartbeat-container" class="flex items-center space-x-2 bg-slate-900/60 px-3 py-1 rounded-full border border-slate-700">
            <span class="relative flex h-3 w-3">
              <span id="hb-ping" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
              <span id="hb-dot" class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
            </span>
            <span id="hb-text" class="text-xs font-medium text-slate-300">Conectando...</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-6">
        <!-- Panel de Métricas en Vivo -->
        <div class="grid grid-cols-3 gap-3">
            <div class="bg-cardbg p-3 rounded-xl border border-slate-800 text-center">
                <span class="text-xs text-slate-400 block">Balance</span>
                <span id="metric-balance" class="text-base font-bold text-slate-100">$---</span>
            </div>
            <div class="bg-cardbg p-3 rounded-xl border border-slate-800 text-center">
                <span class="text-xs text-slate-400 block">PnL Diario</span>
                <span id="metric-pnl" class="text-base font-bold text-emerald-400">---</span>
            </div>
            <div class="bg-cardbg p-3 rounded-xl border border-slate-800 text-center">
                <span class="text-xs text-slate-400 block">Drawdown</span>
                <span id="metric-dd" class="text-base font-bold text-rose-400">---</span>
            </div>
        </div>

        <!-- Sección del Gráfico -->
        <div class="bg-cardbg p-4 rounded-2xl border border-slate-800 shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-semibold text-slate-300"><i class="fa-solid fa-wave-square mr-1 text-emerald-400"></i> Curva de Capital</h2>
                <span class="text-xs text-slate-500">cTrader Live</span>
            </div>
            <div class="relative h-64 w-full">
                <canvas id="capitalChart"></canvas>
            </div>
        </div>

        <!-- Historial de Operaciones del Día -->
        <div class="bg-cardbg p-4 rounded-2xl border border-slate-800 shadow-lg">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-semibold text-slate-300"><i class="fa-solid fa-history mr-1 text-sky-400"></i> Operaciones del Día</h2>
                <span id="trade-count" class="text-xs bg-slate-800 px-2 py-0.5 rounded text-slate-400">0 trades</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="text-slate-500 border-b border-slate-800">
                            <th class="pb-2">Activo</th>
                            <th class="pb-2">Tipo</th>
                            <th class="pb-2">Resultado</th>
                            <th class="pb-2 text-right">Hora</th>
                        </tr>
                    </thead>
                    <tbody id="trades-table-body" class="divide-y divide-slate-800/60">
                        <tr>
                            <td colspan="4" class="py-3 text-center text-slate-500">Sincronizando con el bot...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Configuración inicial del Gráfico Chart.js
        const ctx = document.getElementById('capitalChart').getContext('2d');
        const capitalChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Inicio', 'Sesión'],
                datasets: [{
                    label: 'Capital Real',
                    data: [0, 0],
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.05)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: 'rgba(255, 255, 255, 0.03)' }, ticks: { color: '#64748b' } },
                    y: { grid: { color: 'rgba(255, 255, 255, 0.03)' }, ticks: { color: '#64748b' } }
                }
            }
        });

        // URL de la API apuntando a tu IP fija en Oracle Cloud con puerto 8080
        const API_URL = 'http://193.122.243.181:8080/';

        async function sincronizarDashboardVivo() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Error de red');
                
                const data = await response.json();

                // 1. Actualizar Heartbeat
                const hbDot = document.getElementById('hb-dot');
                const hbPing = document.getElementById('hb-ping');
                const hbText = document.getElementById('hb-text');
                
                if (data.bot_status === 'online') {
                    hbDot.className = "relative inline-flex rounded-full h-3 w-3 bg-emerald-500";
                    hbPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75";
                    hbText.innerText = "Conectado";
                }

                // 2. Actualizar Métricas
                document.getElementById('metric-balance').innerText = `$${data.account.balance.toLocaleString()}`;
                document.getElementById('metric-pnl').innerText = `${data.account.daily_pnl_percent >= 0 ? '+' : ''}${data.account.daily_pnl_percent}%`;
                document.getElementById('metric-dd').innerText = `${data.account.drawdown_percent}%`;

                // 3. Actualizar Tabla de Operaciones
                const tbody = document.getElementById('trades-table-body');
                if (data.today_trades && data.today_trades.length > 0) {
                    tbody.innerHTML = data.today_trades.map(t => `
                        <tr>
                            <td class="py-2.5 font-medium text-slate-200">${t.symbol}</td>
                            <td class="py-2.5"><span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${t.type === 'BUY' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${t.type}</span></td>
                            <td class="py-2.5 font-semibold ${t.color}">${t.result}</td>
                            <td class="py-2.5 text-right text-slate-400">${t.time}</td>
                        </tr>
                    `).join('');
                    document.getElementById('trade-count').innerText = `${data.today_trades.length} trades`;
                }

            } catch (error) {
                console.error("Sin conexión con el bot:", error);
                document.getElementById('hb-dot').className = "relative inline-flex rounded-full h-3 w-3 bg-rose-500";
                document.getElementById('hb-ping').className = "absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-0";
                document.getElementById('hb-text').innerText = "Sin conexión";
            }
        }

        // Sincronizar al iniciar y cada 10 segundos
        sincronizarDashboardVivo();
        setInterval(sincronizarDashboardVivo, 10000);
    </script>
</body>
</html>
